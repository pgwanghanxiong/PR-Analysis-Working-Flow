<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f6f3" />
    <title>Questionnaire Data Analysis | PR Review</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main id="app-shell" class="shell" inert>
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">Q</div>
        <div>
          <p class="eyebrow">QUESTIONNAIRE</p>
          <h1>Questionnaire Data Analysis</h1>
        </div>
        <div id="usage-count" class="usage-count" aria-live="polite" aria-label="Total usage count">
          <span>Total uses</span><strong id="use-count">66</strong>
        </div>
      </header>

      <a class="page-back" href="/questionnaire">&#8592; Questionnaire</a>

      <section class="workflow-section analysis-section" aria-labelledby="analysis-title">
        <form id="analysis-form">
          <div class="workflow-heading">
            <span class="step-number" aria-hidden="true">01</span>
            <div>
              <p class="eyebrow">ANALYSIS SETUP</p>
              <h2 id="analysis-title">Choose Study Name and analyze</h2>
            </div>
          </div>
          <div class="study-fields">
            <label class="field" for="existing-study">
              <span>Study Name from PostgreSQL</span>
              <select id="existing-study">
                <option value="">Loading Study Names...</option>
              </select>
            </label>
            <button id="refresh-studies" class="refresh-button" type="button">Refresh studies</button>
          </div>
          <p id="studies-status" class="status" role="status">Loading existing Study Names...</p>
          <div class="analysis-actions">
            <p id="status" class="status" role="status">Choose an uploaded Study Name to analyze.</p>
            <button id="run-button" class="run-button" type="submit" disabled>
              <span>Run analysis</span><span aria-hidden="true">&#8594;</span>
            </button>
          </div>
        </form>
      </section>

      <section id="results" class="results" hidden>
        <div class="results-heading">
          <div>
            <p class="eyebrow">BUSINESS REPORT</p>
            <h2>PR results</h2>
          </div>
          <div class="downloads" aria-label="Download files">
            <a id="download-report" class="download-link" href="#" download>Excel report <span aria-hidden="true">&#8595;</span></a>
            <a id="download-database" class="download-link secondary" href="#" download>Database CSV <span aria-hidden="true">&#8595;</span></a>
            <a id="download-log" class="icon-link" href="#" title="Download validation log" aria-label="Download validation log">i</a>
          </div>
        </div>

        <div id="database-status" class="database-status" role="status"></div>
        <div class="table-scroll">
          <table id="report-table" aria-label="PR report preview">
            <colgroup></colgroup>
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="report-caption" class="report-caption"></p>
      </section>

      <footer class="footer"><span>Questionnaire</span><span>Data Analysis</span></footer>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
